name: Apply Sony DTW main flow

on:
  push:
    branches: [feat/sony-dtw-main-flow]
    paths:
      - scripts/apply_sony_dtw_main_flow.py
      - .github/workflows/apply-sony-dtw-main-flow.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/sony-dtw-main-flow
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Patch the product workflow
        run: python scripts/apply_sony_dtw_main_flow.py
      - name: Validate the direct integration
        run: |
          python -m py_compile app.py
          python - <<'PY'
          from pathlib import Path

          text = Path('app.py').read_text(encoding='utf-8')
          assert '# LASTRADA_SONY_DTW_MAIN_FLOW_V1' in text
          assert 'Use Sony SampleID + guarded DTW timing analysis' in text
          assert 'value=True' in text
          assert 'Review automated timing provenance' in text
          assert not Path('pages/8_DTW_Lab.py').exists()
          print('Direct Sony -> DTW main-flow integration validated')
          PY
          git diff --check
      - name: Commit generated product changes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.py pages/8_DTW_Lab.py
          if git diff --cached --quiet; then
            echo 'No generated changes to commit.'
          else
            git commit -m 'Integrate Sony and guarded DTW into the main app flow'
            git push origin HEAD:feat/sony-dtw-main-flow
          fi
