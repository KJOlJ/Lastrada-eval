name: Validate Sony production runtime

on:
  pull_request:
    branches: [feat/sony-dtw-main-flow]
    paths:
      - requirements.txt
      - src/lastrada/recognition/sampleid_adapter.py
      - src/lastrada/runtime/**
      - scripts/fetch_sampleid.py
      - scripts/verify_model.py
      - scripts/start_app.py
      - cloudbuild.json
      - .github/workflows/validate-sony-production-runtime.yml
  push:
    branches: [feat/sony-dtw-main-flow]
    paths:
      - requirements.txt
      - src/lastrada/recognition/sampleid_adapter.py
      - src/lastrada/runtime/**
      - scripts/fetch_sampleid.py
      - scripts/verify_model.py
      - scripts/start_app.py
      - cloudbuild.json
      - .github/workflows/validate-sony-production-runtime.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Streamlit production requirements
        run: python -m pip install -r requirements.txt
      - name: Verify Sony source layout and CPU runtime
        run: |
          python - <<'PY'
          import json
          from importlib.metadata import distribution
          import torch
          import sampleid
          from lastrada.recognition.sampleid_adapter import (
              _prepare_sampleid_model_imports,
          )

          origin = json.loads(distribution('sampleid').read_text('direct_url.json'))
          assert origin.get('dir_info', {}).get('editable'), (
              'Sony must be installed editable: its wheel omits model source modules'
          )
          SampleID = _prepare_sampleid_model_imports()
          assert SampleID is not None
          import src.networks.resnet_ibn

          print('torch:', torch.__version__)
          print('sampleid:', sampleid.__file__)
          print('src.networks.resnet_ibn: OK')
          PY
      - name: Download and checksum-verify pinned Sony weights
        run: python scripts/fetch_sampleid.py --output checkpoints/sampleid-best.ckpt
      - name: Verify weights and inference without network access
        run: |
          python - <<'PY'
          import runpy
          from unittest.mock import patch

          with patch('socket.socket.connect', side_effect=AssertionError('Network forbidden')):
              runpy.run_path('scripts/verify_model.py', run_name='__main__')
          PY
