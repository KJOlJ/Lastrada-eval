name: Validate Sony production runtime

on:
  push:
    branches: [feat/sony-dtw-main-flow]
    paths:
      - requirements.txt
      - .github/workflows/validate-sony-production-runtime.yml

jobs:
  runtime:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Streamlit production requirements
        run: python -m pip install -r requirements.txt
      - name: Verify Sony source layout and CPU runtime
        run: |
          python - <<'PY'
          import torch
          import sampleid
          import src.networks.resnet_ibn
          from sampleid import SampleID

          assert SampleID is not None
          print('torch:', torch.__version__)
          print('sampleid:', sampleid.__file__)
          print('src.networks.resnet_ibn: OK')
          PY
